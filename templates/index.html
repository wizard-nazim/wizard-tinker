<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WizardTinker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>WizardTinker</h1>
    <div class="header-actions">
      <label class="btn primary">
        Import wallpaper
        <input type="file" id="file-input" accept="image/*,.gif,.mp4,.webm,.mkv,.mov" hidden>
      </label>
      <button class="btn" id="quit-btn">Quit</button>
    </div>
  </header>

  <section class="current-bar">
    <div id="current-info">Loading…</div>
    <label class="switch">
      <input type="checkbox" id="live-toggle">
      <span class="slider"></span>
    </label>
    <span id="live-label">Live</span>
  </section>

  <section class="panel lock-section">
    <div class="panel-header">
      <h2>Lock screen</h2>
      <div class="blur-control">
        <span>Blur</span>
        <input type="range" id="blur-slider" min="0" max="100" value="85">
        <span id="blur-value">85%</span>
      </div>
    </div>
    <div id="lock-designs" class="gallery small"></div>
  </section>

  <section class="panel themes-section">
    <div class="panel-header">
      <h2>Themes</h2>
      <div class="theme-create">
        <input type="text" id="theme-name" placeholder="Theme name" maxlength="40">
        <button class="btn primary" id="save-theme-btn">Save current as theme</button>
      </div>
    </div>
    <div id="themes" class="gallery small"></div>
  </section>

  <main id="gallery" class="gallery"></main>

  <script src="/static/app.js"></script>
</body>
</html>
